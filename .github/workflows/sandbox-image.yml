name: Sandbox image

# Builds and publishes sandbox targets for amd64 and arm64. Each compose
# file names a tag derived from its build inputs; published tags are immutable.
on:
  push:
    paths:
      - src/cheatbench_inspect/harnesses/resources/sandbox/Dockerfile
      - src/cheatbench_inspect/harnesses/resources/sandbox/task-requirements.txt
      - src/cheatbench_inspect/harnesses/resources/sandbox/terminus-compose.yaml
      - src/cheatbench_inspect/harnesses/resources/sandbox/claude-compose.yaml
      - src/cheatbench_inspect/harnesses/resources/sandbox/base-compose.yaml
      - src/cheatbench_inspect/harnesses/resources/sandbox/claude-requirements.txt
      - src/cheatbench_inspect/harnesses/resources/sandbox/office.Dockerfile
      - src/cheatbench_inspect/harnesses/resources/sandbox/office-requirements.txt
      - src/cheatbench_inspect/harnesses/resources/sandbox/*-office-compose.yaml
      - .github/workflows/sandbox-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-image-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTEXT: src/cheatbench_inspect/harnesses/resources/sandbox

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: terminus
            stage: terminus
          - target: claude
            stage: claude
          - target: base
            stage: task
          - target: terminus-office
            stage: office
            runtime: terminus
          - target: claude-office
            stage: office
            runtime: claude
          - target: base-office
            stage: office
            runtime: base
    env:
      IMAGE: ghcr.io/rowan-dauria/task-env-${{ matrix.target }}
      TARGET: ${{ matrix.target }}
      RUNTIME: ${{ matrix.runtime }}
    permissions:
      contents: read
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute the tag and check the compose file names it
        id: tag
        run: |
          if [ -n "$RUNTIME" ]; then
            tag="$(cat "$CONTEXT/office.Dockerfile" "$CONTEXT/office-requirements.txt" | sha256sum | cut -c1-12)"
          elif [ "$TARGET" = claude ]; then
            tag="$(cat "$CONTEXT/Dockerfile" "$CONTEXT/task-requirements.txt" "$CONTEXT/claude-requirements.txt" | sha256sum | cut -c1-12)"
          else
            tag="$(cat "$CONTEXT/Dockerfile" "$CONTEXT/task-requirements.txt" | sha256sum | cut -c1-12)"
          fi
          grep -qx "    image: $IMAGE:$tag" "$CONTEXT/$TARGET-compose.yaml" || {
            echo "::error::$TARGET-compose.yaml must name $IMAGE:$tag"
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether the tag is already published
        id: existing
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if docker manifest inspect "$IMAGE:$TAG" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$TAG is already published."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.existing.outputs.published == 'false'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.existing.outputs.published == 'false'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.existing.outputs.published == 'false'
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/${{ matrix.runtime && 'office.Dockerfile' || 'Dockerfile' }}
          target: ${{ matrix.stage }}
          build-args: ${{ matrix.runtime && format('RUNTIME={0}', matrix.runtime) || '' }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
