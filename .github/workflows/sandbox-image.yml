name: Sandbox image

# Builds the Terminus-2 sandbox (the Dockerfile's `terminus` target) for amd64
# and arm64 and publishes it to GHCR, for Hawk, which pulls sandbox images rather
# than building them. The tag is a hash of the build inputs, the one
# terminus-compose.yaml names, so a published tag never changes: an existing tag
# is left alone.
on:
  push:
    paths:
      - src/cheatbench_inspect/resources/sandbox/Dockerfile
      - src/cheatbench_inspect/resources/sandbox/task-requirements.txt
      - src/cheatbench_inspect/resources/sandbox/terminus-compose.yaml
      - .github/workflows/sandbox-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rowan-dauria/task-env-terminus
  CONTEXT: src/cheatbench_inspect/resources/sandbox

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute the tag and check terminus-compose.yaml names it
        id: tag
        run: |
          tag="$(cat "$CONTEXT/Dockerfile" "$CONTEXT/task-requirements.txt" | sha256sum | cut -c1-12)"
          grep -qx "    image: $IMAGE:$tag" "$CONTEXT/terminus-compose.yaml" || {
            echo "::error::terminus-compose.yaml must name $IMAGE:$tag"
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether the tag is already published
        id: existing
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if docker manifest inspect "$IMAGE:$TAG" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$TAG is already published."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.existing.outputs.published == 'false'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.existing.outputs.published == 'false'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.existing.outputs.published == 'false'
        with:
          context: ${{ env.CONTEXT }}
          target: terminus
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
