# Run with hawk eval-set run configs/hawk/synthetic-puzzles-claude-sonnet-5.yaml
# One-row port smoke test. This model is outside the paper cohorts.
name: synthetic-puzzles-claude-sonnet-5
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@9a1bd167752a8f28fa88a046c5212dbd8ce161e6
    name: cheatbench_inspect
    items:
      - name: cheatbench_synthetic_puzzles
        args:
          harness: claude-code
          dataset_limit: 1
          harness_version: "2.1.270"
          harness_model: claude-sonnet-5
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/anthropic/claude-sonnet-5
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
