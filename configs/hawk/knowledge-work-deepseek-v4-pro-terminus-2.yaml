# Run with hawk eval-set run configs/hawk/knowledge-work-deepseek-v4-pro-terminus-2.yaml
# DeepSeek V4 Pro on Terminus-2, all 20 rows.
# Port test, not a paper row: the original ran DeepSeek V4 Pro in DeepSeek Harness, which the port lacks,
# so it runs on Terminus-2 per the 2026-11-22 decision.
name: knowledge-work-deepseek-v4-pro-terminus-2
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@ed44e8384dfdfecff91f5a103a501895668f631b
    name: cheatbench_inspect
    items:
      - name: cheatbench_knowledge_work
        args:
          harness: terminus-2
          dataset_limit: 20
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/deepseek/deepseek-v4-pro
        args:
          config:
            reasoning_effort: high
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
