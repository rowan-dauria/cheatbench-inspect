# Run with hawk eval-set run configs/hawk/synthetic-puzzles-claude-opus-5.5.yaml
# Release claude-code cohort configuration with 20 rows and the task default 1800 s timeout.
# The original adaptive thinking object is not sent through OpenRouter.
name: synthetic-puzzles-claude-opus-5.5
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@cd8133d322b91a8bcf901dac816da426cd4aba18
    name: cheatbench_inspect
    items:
      - name: cheatbench_synthetic_puzzles
        args:
          harness: claude-code
          dataset_limit: 20
          harness_version: "2.1.281"
          harness_model: claude-opus-5-5
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/anthropic/claude-opus-5.5
        args:
          config:
            reasoning_effort: high
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
