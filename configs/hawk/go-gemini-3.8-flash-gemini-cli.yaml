# Run with hawk eval-set run configs/hawk/go-gemini-3.8-flash-gemini-cli.yaml
# Tables 2-3 (Games / provider harness) and Appendix B.9: 20 certified positions, gemini-cli 0.59.0.
# Separate GPU `engine` service requested in codex-go-compose.yaml.
name: go-gemini-3.8-flash-gemini-cli
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@PIN_ME
    name: cheatbench_inspect
    items:
      - name: cheatbench_go
        args:
          dataset_limit: 20
          harness: gemini-cli
          harness_version: "0.59.0"
          harness_model: gemini-3.8-flash
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/google/gemini-3.8-flash
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
