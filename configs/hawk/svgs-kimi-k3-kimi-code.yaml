# Tables 2–3 and Appendix B.5. Requires the shared Kimi Code harness from PR #32.
# https://arxiv.org/pdf/2609.36308
name: svgs-kimi-k3-kimi-code
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@ac64552688b23fae7e7cbac19fd8476729d8471f
    name: cheatbench_inspect
    items:
      - name: cheatbench_svgs
        args:
          dataset_limit: 10
          harness: kimi-code
          harness_version: "0.43.0"
          harness_model: moonshotai/kimi-k3
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/moonshotai/kimi-k3
        args:
          config:
            reasoning_effort: high
            extra_body:
              provider:
                order: [moonshotai]
                allow_fallbacks: false
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
isolation: standard
