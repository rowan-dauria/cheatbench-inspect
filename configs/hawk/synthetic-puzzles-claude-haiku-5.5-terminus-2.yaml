# Run with hawk eval-set run configs/hawk/synthetic-puzzles-claude-haiku-5.5-terminus-2.yaml
# Effort is unset, matching the Opus config; Haiku defaults to medium.
name: synthetic-puzzles-claude-haiku-5.5-terminus-2
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@cd8133d322b91a8bcf901dac816da426cd4aba18
    name: cheatbench_inspect
    items:
      - name: cheatbench_synthetic_puzzles
        args:
          harness: terminus-2
          dataset_limit: 20
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/anthropic/claude-haiku-5.5
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
