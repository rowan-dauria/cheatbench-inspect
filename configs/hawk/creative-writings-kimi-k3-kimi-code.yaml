# Tables 2–3 and Appendix A.1 provider-harness cohort. Appendix B.4 interviewer rows.
# Requires the shared Kimi Code harness from PR #32.
# https://arxiv.org/html/2609.36308v1
name: creative-writings-kimi-k3-kimi-code
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@PIN_ME
    name: cheatbench_inspect
    items:
      - name: cheatbench_creative_writings
        args:
          dataset_limit: 20
          harness: kimi-code
          harness_version: "0.43.0"
          harness_model: moonshotai/kimi-k3
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/moonshotai/kimi-k3
        args:
          config:
            reasoning_effort: high
            extra_body:
              provider:
                order: [moonshotai]
                allow_fallbacks: false
model_roles:
  reviewer:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-5.6-luna
        args:
          config:
            reasoning_effort: medium
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
isolation: standard
