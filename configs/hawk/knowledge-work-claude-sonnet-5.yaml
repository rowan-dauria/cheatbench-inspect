# Run with hawk eval-set run configs/hawk/knowledge-work-claude-sonnet-5.yaml
# One-row port smoke test. This model is outside the paper cohorts.
name: knowledge-work-claude-sonnet-5
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@0db61ce6222c7ba45a83fcaf28738df10d0bbe62
    name: cheatbench_inspect
    items:
      - name: cheatbench_knowledge_work
        args:
          harness: claude-code
          dataset_limit: 1
          harness_version: "2.1.270"
          harness_model: claude-sonnet-5
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/anthropic/claude-sonnet-5
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
