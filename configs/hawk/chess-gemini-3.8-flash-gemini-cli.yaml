# Run with hawk eval-set run configs/hawk/chess-gemini-3.8-flash-gemini-cli.yaml
# Tables 2-3 (Games / provider harness), Appendix B.9, and pinned task README: 30 release positions, gemini-cli 0.59.0.
name: chess-gemini-3.8-flash-gemini-cli
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@769fc11d97294ace4bee621134785a95a21f33ab
    name: cheatbench_inspect
    items:
      - name: cheatbench_chess
        args:
          dataset_limit: 30
          harness: gemini-cli
          harness_version: "0.59.0"
          harness_model: gemini-3.8-flash
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/google/gemini-3.8-flash
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
