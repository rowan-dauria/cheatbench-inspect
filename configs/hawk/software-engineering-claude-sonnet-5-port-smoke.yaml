# Run with hawk eval-set run configs/hawk/software-engineering-claude-sonnet-5-port-smoke.yaml
# One-instance port smoke test on claude-code (2.1.270). Outside the paper cohorts.
# Budget for cold multi-GB SWE-bench Pro image pulls.
name: software-engineering-claude-sonnet-5-port-smoke
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@d42f57fa0d274eb97fda79f557996b772b438ee5
    name: cheatbench_inspect
    items:
      - name: cheatbench_software_engineering
        args:
          harness: claude-code
          dataset_limit: 1
          harness_version: "2.1.270"
          harness_model: claude-sonnet-5
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/anthropic/claude-sonnet-5
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
isolation: standard
