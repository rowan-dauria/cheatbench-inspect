# Run with hawk eval-set run configs/hawk/openmath-gpt-5.6-sol.yaml
# Release codex cohort configuration with all 20 problems and the 3600 s episode timeout.
name: openmath-gpt-5.6-sol
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@ecf4ee4380c5ebbea7de19cd945991df984e6a47
    name: cheatbench_inspect
    items:
      - name: cheatbench_openmath
        args:
          harness: codex
          dataset_limit: 20
          harness_version: "0.154.0"
          harness_model: gpt-5.6-sol
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-5.6-sol
        args:
          responses_api: true
          config:
            reasoning_effort: high
            reasoning_summary: detailed
            verbosity: low
            parallel_tool_calls: false
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
isolation: standard
