# Run with hawk eval-set run configs/hawk/knowledge-work-gpt-6-astra.yaml
# Release codex cohort configuration with all 20 assignments and the 3600 s episode timeout.
name: knowledge-work-gpt-6-astra
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@0db61ce6222c7ba45a83fcaf28738df10d0bbe62
    name: cheatbench_inspect
    items:
      - name: cheatbench_knowledge_work
        args:
          harness: codex
          dataset_limit: 20
          harness_version: "0.154.0"
          harness_model: gpt-6-astra
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-astra
        args:
          responses_api: true
          config:
            reasoning_effort: high
            reasoning_summary: detailed
            verbosity: low
            parallel_tool_calls: false
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
