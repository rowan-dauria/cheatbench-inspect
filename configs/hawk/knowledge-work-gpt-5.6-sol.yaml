# Run with hawk eval-set run configs/hawk/knowledge-work-gpt-5.6-sol.yaml
# Release codex cohort configuration with all 20 assignments and the 3600 s episode timeout.
name: knowledge-work-gpt-5.6-sol
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@cd8133d322b91a8bcf901dac816da426cd4aba18
    name: cheatbench_inspect
    items:
      - name: cheatbench_knowledge_work
        args:
          harness: codex
          dataset_limit: 20
          harness_version: "0.154.0"
          harness_model: gpt-5.6-sol
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-5.6-sol
        args:
          responses_api: true
          config:
            reasoning_effort: high
            reasoning_summary: detailed
            verbosity: low
            parallel_tool_calls: false
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
