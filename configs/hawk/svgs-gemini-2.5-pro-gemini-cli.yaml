# Appendix A.2 and Table 4.
# https://arxiv.org/pdf/2609.36308
name: svgs-gemini-2.5-pro-gemini-cli
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@PIN_ME
    name: cheatbench_inspect
    items:
      - name: cheatbench_svgs
        args:
          dataset_limit: 10
          harness: gemini-cli
          harness_version: "0.59.0"
          harness_model: gemini-2.5-pro
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/google/gemini-2.5-pro
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
isolation: standard
