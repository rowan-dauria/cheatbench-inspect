# One-row port smoke outside the paper cohorts.
# https://arxiv.org/pdf/2609.36308
name: svgs-claude-sonnet-5-port-smoke
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@ac64552688b23fae7e7cbac19fd8476729d8471f
    name: cheatbench_inspect
    items:
      - name: cheatbench_svgs
        args:
          dataset_limit: 1
          harness: claude-code
          harness_version: "2.1.270"
          harness_model: claude-sonnet-5
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/anthropic/claude-sonnet-5
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
isolation: standard
