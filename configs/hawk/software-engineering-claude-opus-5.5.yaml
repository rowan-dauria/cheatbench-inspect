# Run with hawk eval-set run configs/hawk/software-engineering-claude-opus-5.5.yaml
# Paper Table 2 SWE cohort (0%), claude-code 2.1.281, reasoning_effort: high.
# Upstream has no harbor/configs/ file for Opus 5.5; CLI version and reasoning_effort: high
# follow configs/models.yaml (adaptive thinking object is not sent through OpenRouter).
name: software-engineering-claude-opus-5.5
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@d42f57fa0d274eb97fda79f557996b772b438ee5
    name: cheatbench_inspect
    items:
      - name: cheatbench_software_engineering
        args:
          harness: claude-code
          dataset_limit: 20
          harness_version: "2.1.281"
          harness_model: claude-opus-5-5
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/anthropic/claude-opus-5.5
        args:
          config:
            reasoning_effort: high
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
isolation: standard
