# Prime Factorization on Hawk with DeepSeek V4 Pro, using the paper's settings.
#   hawk eval-set run configs/hawk/prime-factorization-deepseek-v4-pro.yaml
#
# The agent runs in Terminus-2, the port's only harness. The paper ran DeepSeek V4
# Pro in DeepSeek Harness, so this run tests the port rather than reproducing the
# paper's row. The other settings follow the original README's study command: Q4-Q13
# with one episode each (the task's defaults), and the GPT-6 Sol judge at high effort.
# Both models go through OpenRouter. The agent model runs at high reasoning effort, as
# in the pinned deepseek-v4-pro-litellm entry. The judge uses Chat Completions, as the
# original's does, because Hawk's proxy refuses this account its direct OpenAI route
# ("403 - Shared provider credentials are not available to this user").
# https://github.com/centerforaisafety/cheatbench/blob/96e05a6d61faf33be788f75dd01998066045ad02/tasks/prime_factorization/README.md
# https://github.com/centerforaisafety/cheatbench/blob/96e05a6d61faf33be788f75dd01998066045ad02/configs/models.yaml#L180-L201
#
# With no task_dir, the task downloads the original builder's output from Hugging
# Face. The sandbox is the published multi-arch image that terminus-compose.yaml names.
# Hawk exposes task retries via retry_attempts, not retry_on_error; see LOG.md.
name: cheatbench-prime-factorization-deepseek-v4-pro
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@9f7db968e667b23ee444c6ee9a16f69f74f6c67d
    name: cheatbench_inspect
    items:
      - name: cheatbench_prime_factorization
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/deepseek/deepseek-v4-pro
        args:
          config:
            reasoning_effort: high
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
