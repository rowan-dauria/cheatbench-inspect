# Terminus-2 port test for the Table 2 model. The paper uses Grok Build.
# https://arxiv.org/html/2609.36308v1
name: creative-writings-grok-4.7-terminus-2
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@PIN_ME
    name: cheatbench_inspect
    items:
      - name: cheatbench_creative_writings
        args:
          harness: terminus-2
          dataset_limit: 20
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/x-ai/grok-4.7
        args:
          config:
            reasoning_effort: high
model_roles:
  reviewer:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-5.6-luna
        args:
          config:
            reasoning_effort: medium
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
isolation: standard
