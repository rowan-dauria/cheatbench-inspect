# Run with hawk eval-set run configs/hawk/go-claude-opus-5-terminus-2.yaml
# Table 3 (general harness / Terminus-2) and Appendix B.9: 20 certified positions.
# Separate GPU `engine` service requested in terminus-go-compose.yaml.
# The original adaptive thinking object is not sent through OpenRouter.
name: go-claude-opus-5-terminus-2
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@PIN_ME
    name: cheatbench_inspect
    items:
      - name: cheatbench_go
        args:
          dataset_limit: 20
          harness: terminus-2
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/anthropic/claude-opus-5
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
