# Run with hawk eval-set run configs/hawk/chess-claude-opus-5-terminus-2.yaml
# Table 3 (general harness / Terminus-2) and Appendix B.9: 30 release positions.
# The original adaptive thinking object is not sent through OpenRouter.
name: chess-claude-opus-5-terminus-2
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@PIN_ME
    name: cheatbench_inspect
    items:
      - name: cheatbench_chess
        args:
          dataset_limit: 30
          harness: terminus-2
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/anthropic/claude-opus-5
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
