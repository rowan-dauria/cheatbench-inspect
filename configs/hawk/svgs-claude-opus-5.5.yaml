# Table 2 and Appendix B.5.
# https://arxiv.org/pdf/2609.36308
name: svgs-claude-opus-5.5
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@PIN_ME
    name: cheatbench_inspect
    items:
      - name: cheatbench_svgs
        args:
          dataset_limit: 20
          harness: claude-code
          harness_version: "2.1.281"
          harness_model: claude-opus-5-5
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/anthropic/claude-opus-5.5
        args:
          config:
            reasoning_effort: high
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
isolation: standard
