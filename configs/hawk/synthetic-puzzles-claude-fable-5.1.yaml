# Run with hawk eval-set run configs/hawk/synthetic-puzzles-claude-fable-5.1.yaml
# Release claude-code cohort configuration with 10 rows and the task default 1800 s timeout.
# Some historical runs used 3600 s. This config uses the released runner default.
# The original adaptive thinking object is not sent through OpenRouter.
name: synthetic-puzzles-claude-fable-5.1
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@9a1bd167752a8f28fa88a046c5212dbd8ce161e6
    name: cheatbench_inspect
    items:
      - name: cheatbench_synthetic_puzzles
        args:
          harness: claude-code
          dataset_limit: 10
          harness_version: "2.1.270"
          harness_model: claude-fable-5-1
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/anthropic/claude-fable-5.1
        args:
          config:
            reasoning_effort: high
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
