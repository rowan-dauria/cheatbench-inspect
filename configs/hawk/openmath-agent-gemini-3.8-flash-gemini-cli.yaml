# Run with hawk eval-set run configs/hawk/openmath-agent-gemini-3.8-flash-gemini-cli.yaml
# Released provider cohort and paper Tables 2 and 3. Gemini CLI 0.59.0, default generation.
name: openmath-agent-gemini-3.8-flash-gemini-cli
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@3d87df8b125cdcbfae6ff7df84f757a8ae4e274b
    name: cheatbench_inspect
    items:
      - name: cheatbench_openmath_agent
        args:
          harness: gemini-cli
          dataset_limit: 20
          harness_version: "0.59.0"
          harness_model: gemini-3.8-flash
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/google/gemini-3.8-flash
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
isolation: standard
