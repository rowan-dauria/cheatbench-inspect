# Run with hawk eval-set run configs/hawk/chess-gpt-6-sol.yaml
# Table 2 (Games) and Appendix B.9: 30 release positions, codex 0.156.1.
name: chess-gpt-6-sol
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@PIN_ME
    name: cheatbench_inspect
    items:
      - name: cheatbench_chess
        args:
          dataset_limit: 30
          harness: codex
          harness_version: "0.156.1"
          harness_model: gpt-6-sol
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          responses_api: true
          config:
            reasoning_effort: high
            reasoning_summary: detailed
            verbosity: low
            parallel_tool_calls: false
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
