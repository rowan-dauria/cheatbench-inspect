# Run with hawk eval-set run configs/hawk/synthetic-puzzles-gpt-6-astra.yaml
# Release codex cohort configuration with 10 rows and the task default 1800 s timeout.
# Some historical runs used 3600 s. This config uses the released runner default.
name: synthetic-puzzles-gpt-6-astra
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@cd8133d322b91a8bcf901dac816da426cd4aba18
    name: cheatbench_inspect
    items:
      - name: cheatbench_synthetic_puzzles
        args:
          harness: codex
          dataset_limit: 10
          harness_version: "0.154.0"
          harness_model: gpt-6-astra
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-astra
        args:
          responses_api: true
          config:
            reasoning_effort: high
            reasoning_summary: detailed
            verbosity: low
            parallel_tool_calls: false
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
