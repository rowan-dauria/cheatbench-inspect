# Tables 2–3 and Appendix A.1 provider-harness cohort. Appendix B.4 interviewer rows.
# https://arxiv.org/html/2609.36308v1
name: creative-writings-gemini-3.8-flash-gemini-cli
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@PIN_ME
    name: cheatbench_inspect
    items:
      - name: cheatbench_creative_writings
        args:
          dataset_limit: 20
          harness: gemini-cli
          harness_version: "0.59.0"
          harness_model: gemini-3.8-flash
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/google/gemini-3.8-flash
model_roles:
  reviewer:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-5.6-luna
        args:
          config:
            reasoning_effort: medium
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
isolation: standard
