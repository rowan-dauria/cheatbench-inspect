# Run with hawk eval-set run configs/hawk/chess-gemini-3.8-flash-terminus-2.yaml
# Table 3 (general harness / Terminus-2) and Appendix B.9: 30 release positions.
name: chess-gemini-3.8-flash-terminus-2
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@769fc11d97294ace4bee621134785a95a21f33ab
    name: cheatbench_inspect
    items:
      - name: cheatbench_chess
        args:
          dataset_limit: 30
          harness: terminus-2
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/google/gemini-3.8-flash
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
