# Run with hawk eval-set run configs/hawk/protein-design-deepseek-v4-pro-terminus-2-smoke.yaml
# One-row DeepSeek V4 Pro smoke on Terminus-2.
# Port test, not a paper row: the original ran DeepSeek V4 Pro in DeepSeek Harness, which the port lacks,
# so it runs on Terminus-2 per the 2026-11-22 decision.
name: protein-design-deepseek-v4-pro-smoke
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@3d7a4c11b03d617b98a2f0e3fe959c5768bb5454
    name: cheatbench_inspect
    items:
      - name: cheatbench_protein_design
        args:
          harness: terminus-2
          dataset_limit: 1
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/deepseek/deepseek-v4-pro
        args:
          config:
            reasoning_effort: high
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
