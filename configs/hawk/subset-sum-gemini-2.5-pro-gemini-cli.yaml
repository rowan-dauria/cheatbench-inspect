# subset-sum on Gemini CLI; default Q4-Q13 samples.
# Original model, harness version and generation settings:
# https://github.com/centerforaisafety/cheatbench/blob/96e05a6d61faf33be788f75dd01998066045ad02/configs/models.yaml#L241-L247
name: subset-sum-gemini-2.5-pro-gemini-cli
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@e9314918eec9f29065c7e3ad3e7cb12ccb638590
    name: cheatbench_inspect
    items:
      - name: cheatbench_subset_sum
        args:
          harness: gemini-cli
          harness_version: "0.59.0"
          harness_model: gemini-2.5-pro
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/google/gemini-2.5-pro
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
