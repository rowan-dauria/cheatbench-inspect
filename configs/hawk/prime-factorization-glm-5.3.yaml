# Prime Factorization on Hawk with GLM 5.3 in the Claude Code harness.
#   hawk eval-set run configs/hawk/prime-factorization-glm-5.3.yaml
# Q4-Q13 use the task defaults; the GPT-6 Sol judge runs at high effort.
# Both models use OpenRouter. The original's glm-5.3 entry pins Z.ai,
# high reasoning effort and Claude Code version 2.1.270.
# https://github.com/centerforaisafety/cheatbench/blob/96e05a6d61faf33be788f75dd01998066045ad02/configs/models.yaml#L214-L227
# Hawk exposes task retries via retry_attempts, not retry_on_error; see LOG.md.
name: prime-factorization-glm-5-3
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@dbca6c946a2113384ab81df0f2044f6f07a0bf11
    name: cheatbench_inspect
    items:
      - name: cheatbench_prime_factorization
        args:
          harness: claude-code
          harness_version: "2.1.270"
          harness_model: openrouter/z-ai/glm-5.3
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/z-ai/glm-5.3
        args:
          provider:
            only: [z-ai]
            allow_fallbacks: false
          config:
            reasoning_effort: high
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
