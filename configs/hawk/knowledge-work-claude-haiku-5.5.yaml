# Run with hawk eval-set run configs/hawk/knowledge-work-claude-haiku-5.5.yaml
# Claude Code effort is unset; the pinned harness exposes no effort option (Haiku defaults to medium).
name: knowledge-work-claude-haiku-5.5
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@cd8133d322b91a8bcf901dac816da426cd4aba18
    name: cheatbench_inspect
    items:
      - name: cheatbench_knowledge_work
        args:
          harness: claude-code
          dataset_limit: 20
          harness_version: "2.1.270"
          harness_model: claude-haiku-5-5
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/anthropic/claude-haiku-5.5
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
