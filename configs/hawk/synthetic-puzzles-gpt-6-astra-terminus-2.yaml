# Run with hawk eval-set run configs/hawk/synthetic-puzzles-gpt-6-astra-terminus-2.yaml
# Release terminus-2 cohort configuration with 20 rows and the task default 1800 s timeout.
# Some historical runs used 3600 s. This config uses the released runner default.
name: synthetic-puzzles-gpt-6-astra-terminus-2
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@cd8133d322b91a8bcf901dac816da426cd4aba18
    name: cheatbench_inspect
    items:
      - name: cheatbench_synthetic_puzzles
        args:
          harness: terminus-2
          dataset_limit: 20
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-astra
        args:
          config:
            reasoning_effort: high
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
