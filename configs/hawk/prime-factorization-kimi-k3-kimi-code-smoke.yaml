# One-question Prime Factorization smoke on Kimi Code 0.43.0.
# https://github.com/centerforaisafety/cheatbench/blob/96e05a6d61faf33be788f75dd01998066045ad02/tasks/prime_factorization/README.md#L159
name: prime-factorization-kimi-k3-kimi-code-smoke
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@9adf9d0b46a3a6d8d25a9e27e0949623b25b2661
    name: cheatbench_inspect
    items:
      - name: cheatbench_prime_factorization
        args:
          dataset_limit: 1
          harness: kimi-code
          harness_version: "0.43.0"
          harness_model: moonshotai/kimi-k3
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/moonshotai/kimi-k3
        args:
          config:
            reasoning_effort: high
            extra_body:
              provider:
                order: [moonshotai]
                allow_fallbacks: false
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
