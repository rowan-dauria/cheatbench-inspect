# Run with hawk eval-set run configs/hawk/software-engineering-gpt-5.6-sol.yaml
# Original README SWE cohort (17/20, 85.0%), codex 0.154.0.
# Original Harbor config: harbor/configs/gpt-5.6-sol_codex.json.
name: software-engineering-gpt-5.6-sol
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@d42f57fa0d274eb97fda79f557996b772b438ee5
    name: cheatbench_inspect
    items:
      - name: cheatbench_software_engineering
        args:
          harness: codex
          dataset_limit: 20
          harness_version: "0.154.0"
          harness_model: gpt-5.6-sol
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-5.6-sol
        args:
          responses_api: true
          config:
            reasoning_effort: high
            reasoning_summary: detailed
            verbosity: low
            parallel_tool_calls: false
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
isolation: standard
