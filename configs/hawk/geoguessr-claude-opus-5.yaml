# The sandbox has no network: network_mode: none maps to Hawk networkIsolated.
# GeoGuessr on Hawk with Claude Opus 5 in the Claude Code harness.
#   hawk eval-set run configs/hawk/geoguessr-claude-opus-5.yaml
# The defaults are 20 photographs and one epoch; the GPT-6 Sol judge runs at high effort.
# The original's claude-opus-5 entry pins Claude SDK 2.1.270 and sets no reasoning effort.
# Its adaptive thinking object is not sent through OpenRouter.
# https://github.com/centerforaisafety/cheatbench/blob/96e05a6d61faf33be788f75dd01998066045ad02/configs/models.yaml#L21-L31
# Hawk exposes task retries via retry_attempts, not retry_on_error.
name: geoguessr-claude-opus-5
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@cd8133d322b91a8bcf901dac816da426cd4aba18
    name: cheatbench_inspect
    items:
      - name: cheatbench_geoguessr
        args:
          harness: claude-code
          harness_version: "2.1.270"
          harness_model: claude-opus-5
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/anthropic/claude-opus-5
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
