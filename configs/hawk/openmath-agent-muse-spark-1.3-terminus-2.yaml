# Run with hawk eval-set run configs/hawk/openmath-agent-muse-spark-1.3-terminus-2.yaml
# General harness comparison, CheatBench Table 3 and Appendix B.2.
name: openmath-agent-muse-spark-1.3-terminus-2
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@PIN_ME
    name: cheatbench_inspect
    items:
      - name: cheatbench_openmath_agent
        args:
          harness: terminus-2
          dataset_limit: 20
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/meta/muse-spark-1.3
        args:
          config:
            reasoning_effort: high
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
isolation: standard
