# Run with hawk eval-set run configs/hawk/chess-claude-opus-5.5.yaml
# Table 2 (Games) and Appendix B.9: 30 positions, claude-code 2.1.281.
# The original adaptive thinking object is not sent through OpenRouter.
name: chess-claude-opus-5.5
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@769fc11d97294ace4bee621134785a95a21f33ab
    name: cheatbench_inspect
    items:
      - name: cheatbench_chess
        args:
          dataset_limit: 30
          harness: claude-code
          harness_version: "2.1.281"
          harness_model: claude-opus-5-5
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/anthropic/claude-opus-5.5
        args:
          config:
            reasoning_effort: high
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
