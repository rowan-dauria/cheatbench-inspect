# Run with hawk eval-set run configs/hawk/chess-claude-opus-5.yaml
# Table 3 (provider harness) and pinned task README: 30 release positions, claude-code 2.1.270.
# The original adaptive thinking object is not sent through OpenRouter.
name: chess-claude-opus-5
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@PIN_ME
    name: cheatbench_inspect
    items:
      - name: cheatbench_chess
        args:
          dataset_limit: 30
          harness: claude-code
          harness_version: "2.1.270"
          harness_model: claude-opus-5
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/anthropic/claude-opus-5
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
