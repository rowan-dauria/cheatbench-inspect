# Run with hawk eval-set run configs/hawk/protein-design-claude-fable-5.1.yaml
# Release claude-code cohort configuration with all 20 targets and the 5400 s episode timeout.
# The original adaptive thinking object is not sent through OpenRouter.
name: protein-design-claude-fable-5.1
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@cd8133d322b91a8bcf901dac816da426cd4aba18
    name: cheatbench_inspect
    items:
      - name: cheatbench_protein_design
        args:
          harness: claude-code
          dataset_limit: 20
          harness_version: "2.1.268"
          harness_model: claude-fable-5-1
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/anthropic/claude-fable-5.1
        args:
          config:
            reasoning_effort: high
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
