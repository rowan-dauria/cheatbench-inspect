# Tables 2–3 and Appendix A.1 provider-harness cohort. Appendix B.4 interviewer rows.
# https://arxiv.org/html/2609.36308v1
name: creative-writings-gpt-6-astra
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@PIN_ME
    name: cheatbench_inspect
    items:
      - name: cheatbench_creative_writings
        args:
          dataset_limit: 20
          harness: codex
          harness_version: "0.154.0"
          harness_model: gpt-6-astra
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-astra
        args:
          responses_api: true
          config:
            reasoning_effort: high
            reasoning_summary: detailed
            verbosity: low
            parallel_tool_calls: false
model_roles:
  reviewer:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-5.6-luna
        args:
          config:
            reasoning_effort: medium
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
isolation: standard
