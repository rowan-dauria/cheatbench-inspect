# Appendix A.2 and Table 4 earlier-model cohort. Appendix B.4 interviewer rows.
# https://arxiv.org/html/2609.36308v1
name: creative-writings-gpt-5
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@aa25da3355a8b932ee50b3801b51f224d6e6d7cd
    name: cheatbench_inspect
    items:
      - name: cheatbench_creative_writings
        args:
          dataset_limit: 20
          harness: codex
          harness_version: "0.154.0"
          harness_model: gpt-5
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-5
        args:
          responses_api: true
          config:
            reasoning_effort: high
            reasoning_summary: detailed
            verbosity: low
            parallel_tool_calls: false
model_roles:
  reviewer:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-5.6-luna
        args:
          config:
            reasoning_effort: medium
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
isolation: standard
