# Run with hawk eval-set run configs/hawk/software-engineering-claude-opus-5.yaml
# Paper Table 3 Provider SWE cohort (25.0%) and original README (5/20), claude-code 2.1.270.
# Original Harbor config: harbor/configs/opus-5_claude-code.json (6000 s timeout,
# max_thinking_tokens: 32000 carried via Inspect GenerateConfig reasoning_tokens).
name: software-engineering-claude-opus-5
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@d42f57fa0d274eb97fda79f557996b772b438ee5
    name: cheatbench_inspect
    items:
      - name: cheatbench_software_engineering
        args:
          harness: claude-code
          dataset_limit: 20
          harness_version: "2.1.270"
          harness_model: claude-opus-5
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/anthropic/claude-opus-5
        args:
          config:
            reasoning_tokens: 32000
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
isolation: standard
