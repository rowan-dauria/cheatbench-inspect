# Table 3 (general harness).
# https://arxiv.org/pdf/2609.36308
name: svgs-kimi-k3-terminus-2
tasks:
  - package: git+https://github.com/rowan-dauria/cheatbench-inspect@PIN_ME
    name: cheatbench_inspect
    items:
      - name: cheatbench_svgs
        args:
          dataset_limit: 10
          harness: terminus-2
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/moonshotai/kimi-k3
        args:
          config:
            reasoning_effort: high
            extra_body:
              provider:
                order: [moonshotai]
                allow_fallbacks: false
model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-6-sol
        args:
          config:
            reasoning_effort: high
retry_attempts: 1
isolation: standard
