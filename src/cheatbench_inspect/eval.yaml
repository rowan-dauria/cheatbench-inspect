title: "cheatbench-inspect"
description: |
  inspect-based implementation of the CheatBench (Phan et al. 2026) benchmark
group: Knowledge # pick the group used by the inspect_evals listing for this benchmark
contributors:
  - rowan-dauria
version: "6-C"
tasks:
  - name: cheatbench_sycophancy
    dataset_samples: 28
  - name: cheatbench_prime_factorization
    dataset_samples: 10
  - name: cheatbench_subset_sum
    dataset_samples: 10
  - name: cheatbench_geoguessr
    dataset_samples: 20
  - name: cheatbench_synthetic_puzzles
    dataset_samples: 20
  - name: cheatbench_knowledge_work
    dataset_samples: 20
  - name: cheatbench_protein_design
    dataset_samples: 20
  - name: cheatbench_openmath
    dataset_samples: 20
  - name: cheatbench_svgs
    dataset_samples: 10

metadata:
  extras:
    task_defaults:
      sycophancy:
        epochs: 100 # Original published sampling protocol: --repeat 100.
      prime_factorization:
        epochs: 1 # Original study protocol: --repeat 1.
        max_turns: 150 # Original run.py:684-685, --max-turns default.
        timeout_s: 3600 # Original tasks/prime_factorization/task.yaml.
        dataset_limit: 10 # Original README reference commands: --limit 10.
      subset_sum:
        epochs: 1 # Original study protocol: --repeat 1.
        max_turns: 150 # Original run.py:684-685, --max-turns default.
        timeout_s: 3600 # Original tasks/subset_sum/task.yaml.
        dataset_limit: 10 # Original task dataset and study protocol.
      geoguessr:
        epochs: 1 # Original study protocol: --repeat 1.
        max_turns: 150 # Original run.py:684-685, --max-turns default.
        timeout_s: 3600 # Original tasks/geoguessr/task.yaml.
        dataset_limit: 20 # Original task dataset and study protocol.
      knowledge_work:
        epochs: 1 # Original study protocol: --repeat 1.
        max_turns: 150 # Original run.py:684-685, --max-turns default.
        timeout_s: 3600 # Original tasks/knowledge_work/task.yaml.
        dataset_limit: 20 # Original tasks/knowledge_work/samples20.json: 20 assignments.
      openmath:
        epochs: 1 # Original study protocol: --repeat 1.
        max_turns: 150 # Original run.py:684-685, --max-turns default.
        timeout_s: 3600 # Original tasks/openmath/task.yaml.
        dataset_limit: 20 # Original nopw variant: 20 problems.
      protein_design:
        epochs: 1 # Original study protocol: --repeat 1.
        max_turns: 150 # Original run.py:684-685, --max-turns default.
        timeout_s: 5400 # Original tasks/protein_design/task.yaml.
        dataset_limit: 20 # Original task dataset and study protocol.
      svgs:
        epochs: 1 # Original SVG study protocol: one episode per brief.
        max_turns: 150 # Original run.py --max-turns default.
        timeout_s: 3600 # Original tasks/svgs/task.yaml.
        dataset_limit: 10 # Paper Appendix B.5, most cohorts use the first ten.
      synthetic_puzzles:
        epochs: 1 # Original study protocol: --repeat 1.
        max_turns: 150 # Original run.py:684-685, --max-turns default.
        timeout_s: 1800 # Original tasks/synthetic_puzzles/task.yaml.
        dataset_limit: 20 # Original task dataset and study protocol.
