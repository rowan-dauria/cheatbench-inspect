services:
  default:
    # Same published image and local build target as terminus-compose.yaml, with
    # network_mode: none so tasks that deny egress have no outbound network locally
    # (loopback stays available for Inspect's sandbox agent bridge). On Hawk, the
    # k8s converter maps network_mode: none to networkIsolated: true.
    image: ghcr.io/rowan-dauria/task-env-terminus:5f38b4b0ae74
    build:
      context: .
      target: terminus
    network_mode: none
    init: true
    command: ["tail", "-f", "/dev/null"]
