services:
  default:
    # Local Docker builds this from the Dockerfile and tags it with this name.
    # Hawk ignores `build:` and pulls the image, which the sandbox-image
    # workflow publishes for linux/amd64 and linux/arm64. The tag is the image
    # build inputs' hash, which a test checks against the files.
    image: ghcr.io/rowan-dauria/task-env-claude:b771f5ffa542
    build:
      context: .
      target: claude
    init: true
    network_mode: bridge
    command: ["tail", "-f", "/dev/null"]
